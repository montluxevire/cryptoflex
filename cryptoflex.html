<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cryptoflex</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --bg-0:#0A0A12;
    --bg-1:#131320;
    --card:#181829;
    --card-hi:#20203A;
    --violet:#8B5CF6;
    --violet-2:#6D4FE0;
    --mint:#3DD9A8;
    --coral:#FF6B6B;
    --text-0:#F4F2FA;
    --text-1:#A9A6C4;
    --text-2:#6E6B8C;
    --line:#26243D;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:
      radial-gradient(circle at 20% -10%, rgba(139,92,246,0.18), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(61,217,168,0.10), transparent 40%),
      var(--bg-0);
    min-height:100vh;
    font-family:'Space Grotesk', sans-serif;
    color:var(--text-0);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .phone{
    width:392px;
    height:800px;
    max-width:100%;
    background:linear-gradient(180deg, var(--bg-1), var(--bg-0));
    border-radius:32px;
    border:1px solid var(--line);
    padding:20px 20px 16px;
    position:relative;
    box-shadow:0 40px 80px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02) inset;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .phone::before{
    content:'';
    position:absolute;
    top:-120px; left:-40px;
    width:280px; height:280px;
    background:radial-gradient(circle, rgba(139,92,246,0.25), transparent 70%);
    filter:blur(10px);
    pointer-events:none;
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
    position:relative; z-index:1;
    flex-shrink:0;
  }
  .logo{
    display:flex; align-items:center; gap:7px;
    font-size:15px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .logo .mark{
    width:22px; height:22px; border-radius:7px;
    background:linear-gradient(135deg, var(--violet), var(--mint));
    display:flex; align-items:center; justify-content:center;
    font-size:12px;
  }
  .icon-btn{
    width:34px; height:34px;
    border-radius:12px;
    background:var(--card);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-1);
    cursor:pointer;
  }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .icon-btn.spinning svg{ animation:spin 0.7s linear infinite; }
  .icon-btn svg{ width:16px; height:16px; }

  .ticker-wrap{
    position:relative; z-index:1;
    overflow:hidden;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--card);
    padding:6px 0;
    margin-bottom:12px;
    flex-shrink:0;
  }
  .ticker{
    display:flex;
    gap:22px;
    white-space:nowrap;
    animation:scroll 18s linear infinite;
    width:max-content;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    padding:0 14px;
  }
  .ticker span{ color:var(--text-1); }
  .ticker span.up{ color:var(--mint); }
  .ticker span.down{ color:var(--coral); }
  @keyframes scroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }

  .balance-wrap{
    position:relative; z-index:1;
    text-align:center;
    padding:2px 0 14px;
    flex-shrink:0;
  }
  .balance-label{
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-2);
    margin-bottom:8px;
  }
  .balance-edit{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:3px;
    padding:0 6px;
  }
  .balance-edit .cur{
    font-size:28px;
    font-weight:600;
    color:var(--text-1);
    line-height:1;
    padding-top:6px;
    flex-shrink:0;
  }
  #balanceInput{
    outline:none;
    color:var(--text-0);
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:46px;
    line-height:1.05;
    max-width:280px;
    word-break:break-all;
    white-space:normal;
    text-align:center;
    caret-color:var(--violet);
    transition:font-size 0.12s ease;
  }
  #balanceInput:empty::before{
    content:'0';
    color:var(--text-2);
  }
  .hint{
    margin-top:7px;
    font-size:11.5px;
    color:var(--text-2);
  }
  .delta{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:10px;
    background:rgba(61,217,168,0.12);
    color:var(--mint);
    font-size:12.5px;
    font-weight:600;
    padding:5px 11px;
    border-radius:20px;
  }

  .actions{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:9px;
    margin-bottom:9px;
    position:relative; z-index:1;
    flex-shrink:0;
  }
  .actions button{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--text-0);
    border-radius:16px;
    padding:10px 0 9px;
    font-family:inherit;
    font-size:11px;
    font-weight:500;
    cursor:pointer;
    transition:transform 0.08s ease, background 0.15s ease;
  }
  .actions button:active{ transform:scale(0.94); background:var(--card-hi); }
  .actions .glyph{
    width:30px; height:30px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--violet), var(--violet-2));
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
  }
  .actions.secondary{ margin-bottom:16px; }
  .actions.secondary .glyph{
    background:linear-gradient(135deg, #2b2b45, #1c1c30);
    border:1px solid var(--line);
  }

  .section-label{
    font-size:12px;
    font-weight:600;
    letter-spacing:0.04em;
    color:var(--text-1);
    margin:2px 2px 8px;
    display:flex;
    justify-content:space-between;
    position:relative; z-index:1;
    flex-shrink:0;
  }
  .section-label span.n{ color:var(--text-2); font-weight:400; }

  .tokens{ display:flex; flex-direction:column; gap:7px; justify-content:space-between; position:relative; z-index:1; flex:1; min-height:0; }
  .token-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:10px 12px;
  }
  .token-icon{
    width:38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    flex-shrink:0;
    color:#fff;
    font-weight:700;
  }
  .token-meta{ flex:1; min-width:0; }
  .token-name{ font-size:14.5px; font-weight:600; }
  .token-sub{ font-size:12px; color:var(--text-2); margin-top:2px; font-family:'JetBrains Mono', monospace; }
  .token-vals{ text-align:right; }
  .token-usd{ font-size:14.5px; font-weight:600; font-family:'JetBrains Mono', monospace; }
  .token-chg{ font-size:11.5px; margin-top:2px; font-weight:600; }
  .up{ color:var(--mint); }
  .down{ color:var(--coral); }

  .footer-note{
    text-align:center;
    font-size:11px;
    color:var(--text-2);
    margin-top:10px;
    position:relative; z-index:1;
    flex-shrink:0;
  }

  .watermark{
    position:absolute;
    bottom:10px;
    right:14px;
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    color:rgba(169,166,196,0.45);
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.06);
    padding:3px 7px;
    border-radius:6px;
    z-index:2;
    pointer-events:none;
    user-select:none;
  }

  /* ---- modal / flow ---- */
  .overlay{
    position:absolute;
    inset:0;
    background:rgba(6,6,12,0.55);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:flex-end;
    z-index:10;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.18s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%;
    background:linear-gradient(180deg, var(--card-hi), var(--bg-1));
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:24px 24px 0 0;
    padding:10px 20px 22px;
    transform:translateY(16px);
    transition:transform 0.2s ease;
    max-height:90%;
    overflow-y:auto;
  }
  .overlay.open .sheet{ transform:translateY(0); }
  .sheet-handle{
    width:36px; height:4px;
    border-radius:3px;
    background:var(--line);
    margin:0 auto 14px;
  }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .sheet-title{ font-size:15.5px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .sheet-title .ico{
    width:26px; height:26px; border-radius:8px;
    background:linear-gradient(135deg, var(--violet), var(--violet-2));
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
  }
  .sheet-close{
    width:28px; height:28px; border-radius:50%;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--text-1);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:13px;
  }

  .modal-sub{ font-size:11px; font-weight:600; color:var(--text-2); margin:16px 2px 8px; text-transform:uppercase; letter-spacing:0.06em; }
  .modal-sub:first-of-type{ margin-top:0; }

  .pill-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{
    padding:9px 15px;
    border-radius:20px;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--text-1);
    font-family:inherit; font-size:12.5px; font-weight:600;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .pill.active{
    background:var(--pc, var(--violet));
    color:#fff;
    border-color:transparent;
  }

  .amount-row{
    display:flex; align-items:center; gap:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px 14px;
  }
  .amount-row span{ font-size:18px; font-weight:600; color:var(--text-1); }
  .amount-row input{
    flex:1; background:transparent; border:none; outline:none;
    font-family:'JetBrains Mono', monospace;
    font-size:18px; color:var(--text-0); font-weight:600;
  }
  .modal-est{ margin-top:8px; font-size:12px; color:var(--text-2); font-family:'JetBrains Mono', monospace; min-height:14px; }

  .addr-box{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:13px 14px; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-1);
  }
  .addr-box button{
    background:var(--card-hi); border:1px solid var(--line); color:var(--text-0);
    border-radius:10px; padding:6px 11px; font-size:11px; font-family:inherit; font-weight:600; cursor:pointer; flex-shrink:0;
  }
  .qr{
    width:148px; height:148px; margin:4px auto 2px;
    border-radius:16px;
    background:
      repeating-linear-gradient(0deg, #fff 0 4px, transparent 4px 8px),
      repeating-linear-gradient(90deg, #fff 0 4px, transparent 4px 8px);
    background-color:#0d0d18;
    background-blend-mode:screen;
    border:1px solid var(--line);
    opacity:0.9;
  }

  .gallery{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .nft-card{
    aspect-ratio:1; border-radius:14px; border:2px solid transparent;
    display:flex; align-items:center; justify-content:center; font-size:26px;
    cursor:pointer;
    transition:border-color 0.15s ease, transform 0.08s ease;
  }
  .nft-card:active{ transform:scale(0.96); }
  .nft-card.active{ border-color:var(--violet); }
  .nft-label{ font-size:10.5px; text-align:center; color:var(--text-2); margin-top:6px; }

  .confirm-btn{
    width:100%; margin-top:20px;
    background:linear-gradient(135deg, var(--violet), var(--violet-2));
    color:#fff; border:none; border-radius:16px;
    padding:15px 0; font-family:inherit; font-size:14.5px; font-weight:700;
    cursor:pointer;
    box-shadow:0 12px 24px -10px rgba(139,92,246,0.55);
  }
  .confirm-btn:active{ transform:scale(0.98); }
  .confirm-btn:disabled{ opacity:0.5; cursor:default; box-shadow:none; }

  .step-processing, .step-success{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:36px 10px 8px;
  }
  .spinner{
    width:42px; height:42px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--violet);
    animation:spin 0.8s linear infinite;
    margin-bottom:16px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .processing-text{ font-size:13px; color:var(--text-1); font-weight:500; }

  .check{
    width:56px; height:56px; border-radius:50%;
    background:rgba(61,217,168,0.15);
    color:var(--mint);
    display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:700; margin-bottom:16px;
  }
  .success-title{ font-size:16px; font-weight:700; margin-bottom:5px; }
  .success-sub{ font-size:12.5px; color:var(--text-2); margin-bottom:4px; }
  .success-tag{
    margin-top:12px; font-size:10.5px; color:var(--text-2);
    background:var(--card); border:1px solid var(--line);
    padding:4px 10px; border-radius:20px;
  }
  .done-btn{
    width:100%; margin-top:22px;
    background:var(--card); border:1px solid var(--line); color:var(--text-0);
    border-radius:16px; padding:14px 0; font-family:inherit; font-size:14px; font-weight:600;
    cursor:pointer;
  }
  .done-btn:active{ transform:scale(0.98); }

  ::selection{ background:rgba(139,92,246,0.35); }
</style>
</head>
<body>

<div id="lockScreen" style="position:fixed;inset:0;z-index:9999;background:#0A0A12;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;padding:24px;">
  <div style="width:100%;max-width:360px;background:#181829;border:1px solid #20203A;border-radius:20px;padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:24px;color:#8B5CF6;font-weight:700;font-size:20px;">
      <div>◆</div>cryptoflex
    </div>
    <p style="color:#9a9ab0;font-size:14px;margin:0 0 20px;">Please enter the password to continue.</p>
    <input id="lockPassword" type="password" placeholder="Password" autocomplete="off" style="width:100%;box-sizing:border-box;background:#0A0A12;border:1px solid #20203A;border-radius:10px;padding:12px 14px;color:#fff;font-size:15px;outline:none;margin-bottom:14px;">
    <div id="lockError" style="color:#FF6B6B;font-size:13px;min-height:18px;margin-bottom:10px;"></div>
    <button id="lockSubmit" style="width:100%;background:#8B5CF6;border:none;border-radius:10px;padding:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;">Unlock</button>
  </div>
</div>

<script>
  (function(){
    var CORRECT_PASSWORD = "L4RPFOR3V3R389";
    var lockScreen = document.getElementById('lockScreen');
    var pwInput = document.getElementById('lockPassword');
    var lockError = document.getElementById('lockError');
    var lockSubmit = document.getElementById('lockSubmit');

    function tryUnlock(){
      if(pwInput.value === CORRECT_PASSWORD){
        lockScreen.style.display = 'none';
      } else {
        lockError.textContent = "Incorrect password. Please try again.";
        pwInput.value = "";
        pwInput.focus();
      }
    }

    lockSubmit.addEventListener('click', tryUnlock);
    pwInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ tryUnlock(); }
    });

    function relock(){
      lockScreen.style.display = 'flex';
      pwInput.value = "";
      lockError.textContent = "";
    }

    window.addEventListener('load', function(){ pwInput.focus(); });

    // Always re-lock when the page is left/hidden or restored from the
    // browser cache (bfcache), so the password is required again.
    window.addEventListener('pagehide', relock);
    window.addEventListener('pageshow', function(e){
      relock();
      if(e.persisted){ pwInput.focus(); }
    });
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState === 'hidden'){ relock(); }
    });
  })();
</script>

<script>
  const TOKENS = [
    { sym:'BTC', name:'Bitcoin',  color:'#F7931A', price:96500, weight:0.45, chg: 2.3 },
    { sym:'ETH', name:'Ethereum', color:'#627EEA', price:3650,  weight:0.25, chg: -1.1 },
    { sym:'SOL', name:'Solana',   color:'#9945FF', price:214,   weight:0.20, chg: 6.7 },
    { sym:'USDC',name:'USD Coin', color:'#2775CA', price:1,     weight:0.10, chg: 0.0 },
  ];

  const input = document.getElementById('balanceInput');
  const list = document.getElementById('tokenList');
  const countLabel = document.getElementById('tokenCount');
  const tickerEl = document.getElementById('ticker');
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');

  /* ---------- Swiss-style apostrophe number formatting ---------- */

  function sanitize(raw){
    let out = raw.replace(/[^0-9.]/g, '');
    const firstDot = out.indexOf('.');
    if(firstDot !== -1){
      out = out.slice(0, firstDot + 1) + out.slice(firstDot + 1).replace(/\./g, '');
    }
    return out;
  }

  function formatDisplay(raw){
    if(raw === '') return '';
    let [intPart, decPart] = raw.split('.');
    intPart = (intPart || '').replace(/\B(?=(\d{3})+(?!\d))/g, "'");
    return decPart !== undefined ? intPart + '.' + decPart : intPart;
  }

  function fmtUSD(n){
    return n.toLocaleString('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtQty(n){
    if(n >= 1000) return n.toLocaleString('de-CH', { maximumFractionDigits: 2 });
    if(n >= 1) return n.toFixed(3);
    return n.toFixed(5);
  }

  function getCaretOffset(el){
    const sel = window.getSelection();
    if(!sel.rangeCount) return 0;
    const range = sel.getRangeAt(0);
    const pre = range.cloneRange();
    pre.selectNodeContents(el);
    pre.setEnd(range.endContainer, range.endOffset);
    return pre.toString().length;
  }

  function setCaretOffset(el, offset){
    const range = document.createRange();
    const sel = window.getSelection();
    let node = el.firstChild;
    if(!node){ node = document.createTextNode(''); el.appendChild(node); }
    const len = node.textContent ? node.textContent.length : 0;
    const pos = Math.max(0, Math.min(offset, len));
    range.setStart(node, pos);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function countSignificant(str, upTo){
    let c = 0;
    for(let i = 0; i < upTo && i < str.length; i++){
      if(str[i] !== "'") c++;
    }
    return c;
  }

  function offsetForSignificant(str, target){
    if(target <= 0) return 0;
    let c = 0;
    for(let i = 0; i < str.length; i++){
      if(str[i] !== "'") c++;
      if(c === target) return i + 1;
    }
    return str.length;
  }

  function autosizeBalance(){
    const len = input.textContent.replace(/'/g, '').length;
    let size;
    if(len <= 6) size = 46;
    else if(len <= 9) size = 38;
    else if(len <= 12) size = 30;
    else if(len <= 16) size = 24;
    else size = 19;
    input.style.fontSize = size + 'px';
  }

  function getBalance(){
    return parseFloat(sanitize(input.textContent)) || 0;
  }

  function setBalance(value){
    value = Math.max(0, value);
    const raw = value % 1 === 0 ? String(Math.round(value)) : value.toFixed(2);
    input.textContent = formatDisplay(raw);
    autosizeBalance();
    renderTokens();
  }

  input.addEventListener('input', () => {
    const caretOld = getCaretOffset(input);
    const oldText = input.textContent;
    const significantBefore = countSignificant(oldText, caretOld);
    const raw = sanitize(oldText);
    const formatted = formatDisplay(raw);
    input.textContent = formatted;
    setCaretOffset(input, offsetForSignificant(formatted, significantBefore));
    autosizeBalance();
    renderTokens();
  });

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); input.blur(); }
  });

  /* ---------- ticker ---------- */

  function rebuildTicker(){
    const tickerItems = TOKENS.map(t =>
      `<span>${t.sym} $${t.price.toLocaleString('de-CH', {maximumFractionDigits: t.price < 10 ? 2 : 0})} <span class="${t.chg >= 0 ? 'up' : 'down'}">${t.chg >= 0 ? '▲' : '▼'}${Math.abs(t.chg).toFixed(1)}%</span></span>`
    );
    tickerEl.innerHTML = tickerItems.concat(tickerItems).join('<span>·</span>');
  }
  rebuildTicker();

  /* ---------- token list ---------- */

  function renderTokens(){
    const total = getBalance();
    list.innerHTML = '';
    countLabel.textContent = TOKENS.length;
    TOKENS.forEach(t => {
      const usdValue = total * t.weight;
      const qty = t.price ? usdValue / t.price : 0;
      const row = document.createElement('div');
      row.className = 'token-row';
      row.innerHTML = `
        <div class="token-icon" style="background:${t.color}">${t.sym.slice(0,1)}</div>
        <div class="token-meta">
          <div class="token-name">${t.name}</div>
          <div class="token-sub">${fmtQty(qty)} ${t.sym}</div>
        </div>
        <div class="token-vals">
          <div class="token-usd">$${fmtUSD(usdValue)}</div>
          <div class="token-chg ${t.chg >= 0 ? 'up' : 'down'}">${t.chg >= 0 ? '▲' : '▼'} ${Math.abs(t.chg)}%</div>
        </div>
      `;
      list.appendChild(row);
    });
  }

  /* ---------- action flows (modal sheets, all fully mocked) ---------- */

  const MODAL_STATE = { action: null, token: TOKENS[0].sym, toToken: TOKENS[1].sym, amount: '', nft: 0 };

  const CONFIG = {
    buy:     { title:'Buy',     icon:'＋', cta:'Buy now' },
    send:    { title:'Send',    icon:'↑',  cta:'Send' },
    receive: { title:'Receive', icon:'↓',  cta:'I\u2019ve sent it' },
    swap:    { title:'Swap',    icon:'⇄',  cta:'Swap now' },
    stake:   { title:'Stake',   icon:'⟁',  cta:'Stake' },
    bridge:  { title:'Bridge',  icon:'⌬',  cta:'Bridge' },
    rewards: { title:'Rewards', icon:'✦',  cta:'Claim' },
    nfts:    { title:'NFTs',    icon:'▣',  cta:'Mint' },
  };

  const NFT_OPTIONS = [
    { emoji:'🦊', label:'Fox #142', bg:'linear-gradient(135deg,#F7931A,#FFD59E)' },
    { emoji:'🐙', label:'Glitch #08', bg:'linear-gradient(135deg,#8B5CF6,#3DD9A8)' },
    { emoji:'🌀', label:'Nova #391', bg:'linear-gradient(135deg,#627EEA,#9945FF)' },
  ];

  const FAKE_ADDRESS = '7xKp9…mQ2vLr…s8Zt';
  const FAKE_REWARD = 12.40;

  function pillRow(name, options, active){
    return `<div class="pill-row" data-pillgroup="${name}">` +
      options.map(sym => {
        const t = TOKENS.find(x => x.sym === sym) || { sym, color:'#8B5CF6' };
        return `<button class="pill ${active===sym?'active':''}" data-pillval="${sym}" style="--pc:${t.color}">${sym}</button>`;
      }).join('') + `</div>`;
  }

  function amountRow(id, value){
    return `<div class="amount-row"><span>$</span><input id="${id}" type="text" inputmode="decimal" value="${value}" placeholder="0.00"></div>`;
  }

  function renderForm(action){
    const s = MODAL_STATE;
    if(action === 'buy'){
      return `
        <div class="modal-sub">Choose a token</div>
        ${pillRow('token', TOKENS.map(t=>t.sym), s.token)}
        <div class="modal-sub">Amount</div>
        ${amountRow('modalAmount', s.amount)}
        <div class="modal-est" id="modalEst"></div>
      `;
    }
    if(action === 'send'){
      return `
        <div class="modal-sub">Token</div>
        ${pillRow('token', TOKENS.map(t=>t.sym), s.token)}
        <div class="modal-sub">Amount</div>
        ${amountRow('modalAmount', s.amount)}
        <div class="modal-sub">To address</div>
        <div class="addr-box"><span>${FAKE_ADDRESS}</span><button type="button" disabled>Paste</button></div>
      `;
    }
    if(action === 'receive'){
      return `
        <div class="qr"></div>
        <div class="addr-box" style="margin-top:10px;"><span>${FAKE_ADDRESS}</span><button type="button" id="copyAddrBtn">Copy</button></div>
        <div class="modal-sub">Simulate incoming amount</div>
        ${amountRow('modalAmount', s.amount)}
      `;
    }
    if(action === 'swap'){
      return `
        <div class="modal-sub">From</div>
        ${pillRow('token', TOKENS.map(t=>t.sym), s.token)}
        <div class="modal-sub">To</div>
        ${pillRow('toToken', TOKENS.map(t=>t.sym), s.toToken)}
        <div class="modal-sub">Amount</div>
        ${amountRow('modalAmount', s.amount)}
      `;
    }
    if(action === 'stake'){
      return `
        <div class="modal-sub">Amount to stake</div>
        ${amountRow('modalAmount', s.amount)}
        <div class="modal-est">Est. APY 6.2% · demo rate</div>
      `;
    }
    if(action === 'bridge'){
      return `
        <div class="modal-sub">From chain</div>
        ${pillRow('chainFrom', ['Solana','Ethereum','Base'], s.chainFrom || 'Solana')}
        <div class="modal-sub">To chain</div>
        ${pillRow('chainTo', ['Ethereum','Base','Solana'], s.chainTo || 'Ethereum')}
        <div class="modal-sub">Amount</div>
        ${amountRow('modalAmount', s.amount)}
      `;
    }
    if(action === 'rewards'){
      return `
        <div class="modal-sub">Available to claim</div>
        <div class="amount-row"><span>$</span><span style="font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;">${fmtUSD(FAKE_REWARD)}</span></div>
        <div class="modal-est">From staking &amp; referral bonuses · demo</div>
      `;
    }
    if(action === 'nfts'){
      return `
        <div class="modal-sub">Pick a drop</div>
        <div class="gallery">
          ${NFT_OPTIONS.map((n,i)=>`
            <div>
              <div class="nft-card ${s.nft===i?'active':''}" data-nft="${i}" style="background:${n.bg}">${n.emoji}</div>
              <div class="nft-label">${n.label}</div>
            </div>`).join('')}
        </div>
      `;
    }
    return '';
  }

  function renderModal(){
    const cfg = CONFIG[MODAL_STATE.action];
    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div class="sheet-title"><div class="ico">${cfg.icon}</div>${cfg.title}</div>
        <div class="sheet-close" id="sheetClose">✕</div>
      </div>
      <div id="sheetBody">${renderForm(MODAL_STATE.action)}</div>
      <button class="confirm-btn" id="confirmBtn">${cfg.cta}</button>
    `;
    bindModalEvents();
  }

  function bindModalEvents(){
    document.getElementById('sheetClose').addEventListener('click', closeModal);
    const amountInput = document.getElementById('modalAmount');
    if(amountInput){
      amountInput.addEventListener('input', () => {
        MODAL_STATE.amount = amountInput.value.replace(/[^0-9.]/g, '');
        updateEstimate();
      });
    }
    sheet.querySelectorAll('[data-pillgroup]').forEach(group => {
      const name = group.getAttribute('data-pillgroup');
      group.querySelectorAll('.pill').forEach(pill => {
        pill.addEventListener('click', () => {
          const val = pill.getAttribute('data-pillval');
          if(name === 'token') MODAL_STATE.token = val;
          else if(name === 'toToken') MODAL_STATE.toToken = val;
          else if(name === 'chainFrom') MODAL_STATE.chainFrom = val;
          else if(name === 'chainTo') MODAL_STATE.chainTo = val;
          renderModal();
        });
      });
    });
    sheet.querySelectorAll('[data-nft]').forEach(card => {
      card.addEventListener('click', () => {
        MODAL_STATE.nft = parseInt(card.getAttribute('data-nft'), 10);
        renderModal();
      });
    });
    const copyBtn = document.getElementById('copyAddrBtn');
    if(copyBtn){
      copyBtn.addEventListener('click', () => {
        copyBtn.textContent = 'Copied';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1200);
      });
    }
    document.getElementById('confirmBtn').addEventListener('click', runConfirm);
    updateEstimate();
  }

  function updateEstimate(){
    const est = document.getElementById('modalEst');
    if(!est || MODAL_STATE.action !== 'buy') return;
    const t = TOKENS.find(x => x.sym === MODAL_STATE.token);
    const amt = parseFloat(MODAL_STATE.amount) || 0;
    const qty = t && t.price ? amt / t.price : 0;
    est.textContent = amt > 0 ? `≈ ${fmtQty(qty)} ${MODAL_STATE.token}` : '';
  }

  function runConfirm(){
    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <div class="step-processing">
        <div class="spinner"></div>
        <div class="processing-text">Processing ${CONFIG[MODAL_STATE.action].title.toLowerCase()}…</div>
      </div>
    `;
    setTimeout(showSuccess, 1100);
  }

  function showSuccess(){
    const action = MODAL_STATE.action;
    const amt = parseFloat(MODAL_STATE.amount) || 0;
    let title = 'Done', sub = '';

    if(action === 'buy'){
      setBalance(getBalance() + amt);
      title = `Bought ${MODAL_STATE.token}`;
      sub = amt > 0 ? `$${fmtUSD(amt)} added to your balance` : 'Purchase complete';
    } else if(action === 'send'){
      setBalance(getBalance() - amt);
      title = `Sent ${MODAL_STATE.token}`;
      sub = amt > 0 ? `$${fmtUSD(amt)} sent to ${FAKE_ADDRESS}` : 'Transfer complete';
    } else if(action === 'receive'){
      setBalance(getBalance() + amt);
      title = 'Transfer received';
      sub = amt > 0 ? `$${fmtUSD(amt)} added to your balance` : 'Waiting for next transfer';
    } else if(action === 'swap'){
      title = `Swapped ${MODAL_STATE.token} → ${MODAL_STATE.toToken}`;
      sub = amt > 0 ? `$${fmtUSD(amt)} converted` : 'Swap complete';
    } else if(action === 'stake'){
      title = 'Staking started';
      sub = amt > 0 ? `$${fmtUSD(amt)} now earning 6.2% APY` : 'Position opened';
    } else if(action === 'bridge'){
      title = 'Bridge complete';
      sub = `${MODAL_STATE.chainFrom || 'Solana'} → ${MODAL_STATE.chainTo || 'Ethereum'}`;
    } else if(action === 'rewards'){
      setBalance(getBalance() + FAKE_REWARD);
      title = 'Rewards claimed';
      sub = `$${fmtUSD(FAKE_REWARD)} added to your balance`;
    } else if(action === 'nfts'){
      const n = NFT_OPTIONS[MODAL_STATE.nft];
      title = `${n.label} minted`;
      sub = 'Added to your collection';
    }

    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <div class="step-success">
        <div class="check">✓</div>
        <div class="success-title">${title}</div>
        <div class="success-sub">${sub}</div>
        <div class="success-tag">demo action · nothing real happened</div>
      </div>
      <button class="done-btn" id="doneBtn">Done</button>
    `;
    document.getElementById('doneBtn').addEventListener('click', closeModal);
  }

  function openModal(action){
    MODAL_STATE.action = action;
    MODAL_STATE.amount = '';
    overlay.classList.add('open');
    renderModal();
  }

  function closeModal(){
    overlay.classList.remove('open');
  }

  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) closeModal();
  });

  document.querySelectorAll('.actions button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => openModal(btn.getAttribute('data-action')));
  });

  /* ---------- fake refresh: prices tick up a little each time ---------- */

  let todayPct = 4.8;
  const refreshBtn = document.getElementById('refreshBtn');
  const deltaBadge = document.getElementById('deltaBadge');

  function updateDeltaBadge(){
    deltaBadge.innerHTML = `▲ ${todayPct.toFixed(1)}% today`;
  }

  refreshBtn.addEventListener('click', () => {
    if(refreshBtn.classList.contains('spinning')) return;
    refreshBtn.classList.add('spinning');

    setTimeout(() => {
      // bump total balance a little, like a favorable market move
      const growth = 1 + (Math.random() * 0.018 + 0.003); // +0.3% to +2.1%
      setBalance(getBalance() * growth);

      // nudge each token's price and today's % change upward
      TOKENS.forEach(t => {
        const bump = Math.random() * 1.3 + 0.15;
        t.chg = +(t.chg + bump).toFixed(1);
        t.price = +(t.price * (1 + Math.random() * 0.02 + 0.002)).toFixed(t.price < 10 ? 4 : 2);
      });
      todayPct += Math.random() * 1.2 + 0.2;

      updateDeltaBadge();
      renderTokens();
      rebuildTicker();
      refreshBtn.classList.remove('spinning');
    }, 750);
  });

  /* ---------- init ---------- */

  input.textContent = "128'430.00";
  autosizeBalance();
  renderTokens();
</script>

</body>
</html>
